name: Daily digest

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC = 08:17 in Baku
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

jobs:
  scrape-and-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape all news sites
        run: python -m scraper_job.run_scrapers

      - name: Make the digest with Gemini
        run: python -m digest_job.run_digest

      - name: Save the raw Gemini answer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-answer
          path: data/last_gemini_answer.json
          if-no-files-found: ignore